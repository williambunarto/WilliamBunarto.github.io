name: Deploy Notification Reliability Patch

on:
  push:
    branches: [main]
    paths:
      - 'wbagent/patch_notification_reliability.py'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          cp "ssh-key-2026-03-30 (1).key" /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Copy patch script to server
        run: |
          scp -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            wbagent/patch_notification_reliability.py \
            ubuntu@williambunarto.duckdns.org:/home/ubuntu/patch_notification_reliability.py

      - name: Backup bot.py + portfolio.py before patching
        run: |
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@williambunarto.duckdns.org"
          $SSH "mkdir -p /home/ubuntu/wbagent/logs && \
                cp /home/ubuntu/bot.py /home/ubuntu/bot.py.bak.\$(date +%Y%m%d%H%M%S) && \
                cp /home/ubuntu/portfolio.py /home/ubuntu/portfolio.py.bak.\$(date +%Y%m%d%H%M%S)"

      - name: Run patch (idempotent)
        run: |
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@williambunarto.duckdns.org"
          $SSH "cd /home/ubuntu && python3 patch_notification_reliability.py"

      - name: Verify syntax
        run: |
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@williambunarto.duckdns.org"
          $SSH "python3 -m py_compile /home/ubuntu/bot.py /home/ubuntu/portfolio.py && echo 'syntax OK'"

      - name: Install/refresh watchdog cron entry (idempotent)
        run: |
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@williambunarto.duckdns.org"
          $SSH bash << 'ENDSSH'
          WATCHDOG='*/5 * * * * pgrep -f "python3 bot.py" >/dev/null || (cd /home/ubuntu && nohup python3 bot.py >> /home/ubuntu/nohup.out 2>&1 & echo "$(date) watchdog restarted bot.py" >> /home/ubuntu/wbagent/logs/watchdog.log)'
          ( crontab -l 2>/dev/null | grep -vF 'watchdog restarted bot.py' ; echo "$WATCHDOG" ) | crontab -
          echo '===== new crontab ====='
          crontab -l
          ENDSSH

      - name: Restart bot process
        run: |
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@williambunarto.duckdns.org"
          $SSH "printf '%s\n' \
            '#!/bin/bash' \
            'pkill -f python3.*bot.py 2>/dev/null; true' \
            'sleep 2' \
            'cd /home/ubuntu' \
            'nohup python3 bot.py >> /home/ubuntu/nohup.out 2>&1 &' \
            'sleep 5' \
            'pgrep -a -f python3.*bot.py > /tmp/bot_newpid.txt 2>&1 || echo none > /tmp/bot_newpid.txt' \
            > /tmp/restart_bot.sh && chmod +x /tmp/restart_bot.sh"
          $SSH "setsid bash /tmp/restart_bot.sh > /tmp/restart_bot.log 2>&1 < /dev/null & echo 'Restart initiated in background'"

      - name: Verify bot restarted
        run: |
          sleep 15
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@williambunarto.duckdns.org"
          $SSH "echo '=== bot.py process ===' && \
                (pgrep -a -f 'python3 bot.py' || echo 'none found'); \
                echo '=== nohup.out tail (last 30) ===' && \
                tail -30 /home/ubuntu/nohup.out"

      - name: Notify Telegram
        run: |
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@williambunarto.duckdns.org"
          $SSH "set -a && source /home/ubuntu/.env && set +a && \
                curl -s \"https://api.telegram.org/bot\${TELEGRAM_BOT_TOKEN}/sendMessage\" \
                  -d \"chat_id=\${TELEGRAM_CHAT_ID}\" \
                  --data-urlencode \"text=WBAgent: notification reliability patch deployed (Telegram send timeouts raised to 30s, retry+fallback added to open pulse, scheduler overlap protection, health logging).\" > /dev/null && echo 'Telegram notified' || echo 'Telegram notify failed (non-fatal)'"
        continue-on-error: true
