name: Apply rotated Telegram token (one-off)
on:
  push:
    paths: ['.github/workflows/rotate-telegram.yml']
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Apply
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          BLOB: 'U2FsdGVkX18mXUuyMEAGFNg50pB0tlB760fG+JH+1xA2rTHeoy+HRdHlg4E1XZR6Z40PWpSzRm3F6+ihRgGozQ=='
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_SSH_KEY" ]; then echo "DEPLOY_SSH_KEY secret is missing"; exit 1; fi
          printf '%s\n' "$DEPLOY_SSH_KEY" > /tmp/deploy_key; chmod 600 /tmp/deploy_key
          PASS=$(printf '%s' "$DEPLOY_SSH_KEY" | tr -d ' \r\n' | sha256sum | cut -d' ' -f1)
          TOKEN=$(printf '%s' "$BLOB" | openssl enc -d -aes-256-cbc -pbkdf2 -a -A -pass "pass:$PASS")
          echo "::add-mask::$TOKEN"
          O="-o StrictHostKeyChecking=no -o ConnectTimeout=15 -o BatchMode=yes -i /tmp/deploy_key"
          printf '%s' "$TOKEN" | ssh $O ubuntu@140.245.103.249 'umask 077; cat > /tmp/.nt'
          ssh $O ubuntu@140.245.103.249 bash -s <<'REMOTE'
          set -uo pipefail
          T=$(cat /tmp/.nt); shred -u /tmp/.nt
          curl -fsS "https://api.telegram.org/bot$T/getMe" | grep -q '"ok":true' || { echo "new token invalid"; exit 1; }
          FILES=$(grep -rIl "8674830266:" /home/ubuntu --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=venv --exclude-dir=.cache --exclude='*.log' --exclude=nohup.out --exclude='*.bak' 2>/dev/null || true)
          for f in $FILES; do cp "$f" "$f.bak-tg"; sed -i -E "s|8674830266:[A-Za-z0-9_-]+|$T|g" "$f"; echo "updated: $f"; done
          curl -s -X PUT http://127.0.0.1:8001/api/settings/ -F "telegram_bot_token=$T" >/dev/null && echo "wbtrade settings updated" || true
          pkill -f "python3.*bot.py" || true; sleep 3
          cd /home/ubuntu && nohup python3 bot.py >> nohup.out 2>&1 &
          sleep 6
          pgrep -f "python3.*bot.py" >/dev/null && echo "bot running" || { echo "bot NOT running"; tail -15 /home/ubuntu/nohup.out; exit 1; }
          sudo systemctl restart wbtrade 2>/dev/null && echo "wbtrade restarted" || true
          REMOTE
# rerun after DEPLOY_SSH_KEY added
