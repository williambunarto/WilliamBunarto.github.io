name: WBAgent Notification Timeout Diagnose

on:
  push:
    paths:
      - '.github/workflows/wbagent-notification-diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          cp "ssh-key-2026-03-30 (1).key" /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: nohup.out tail + process info
        run: |
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@williambunarto.duckdns.org"
          $SSH bash << 'ENDSSH'
          echo '===== nohup.out last 200 lines ====='
          tail -200 /home/ubuntu/nohup.out 2>&1 || echo "no nohup.out"
          echo ''
          echo '===== nohup.out grep pulse/timeout/error (last 100 matches) ====='
          grep -i "pulse\|timeout\|timed out\|error\|exception" /home/ubuntu/nohup.out 2>/dev/null | tail -100 || echo "no matches"
          echo ''
          echo '===== bot.py process start time ====='
          ps -o pid,lstart,etime,cmd -p $(pgrep -f 'python3 bot.py' | head -1) 2>&1 || echo "not found"
          echo ''
          echo '===== ls -la /home/ubuntu/*.log /home/ubuntu/nohup.out ====='
          ls -la /home/ubuntu/*.log /home/ubuntu/nohup.out 2>&1
          ENDSSH

      - name: bot.py relevant code sections
        run: |
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@williambunarto.duckdns.org"
          $SSH bash << 'ENDSSH'
          echo '===== bot.py imports (first 40 lines) ====='
          sed -n '1,40p' /home/ubuntu/bot.py
          echo ''
          echo '===== bot.py scheduled_open_pulse (1100-1150) ====='
          sed -n '1100,1150p' /home/ubuntu/bot.py
          echo ''
          echo '===== bot.py scheduler setup (1240,1275p) ====='
          sed -n '1240,1275p' /home/ubuntu/bot.py
          echo ''
          echo '===== bot.py ApplicationBuilder setup ====='
          grep -n "ApplicationBuilder\|HTTPXRequest\|connect_timeout\|read_timeout\|pool_timeout\|write_timeout" /home/ubuntu/bot.py
          echo ''
          echo '===== bot.py grok references ====='
          grep -n -i "grok" /home/ubuntu/bot.py | head -30
          echo ''
          echo '===== bot.py logging setup ====='
          grep -n "logging.basicConfig\|FileHandler\|log = \|getLogger" /home/ubuntu/bot.py | head -20
          echo ''
          echo '===== portfolio.py get prices / bybit fetch functions (first 100 lines) ====='
          sed -n '1,100p' /home/ubuntu/portfolio.py
          ENDSSH
