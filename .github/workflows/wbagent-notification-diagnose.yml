name: WBAgent Notification Timeout Diagnose

on:
  push:
    paths:
      - '.github/workflows/wbagent-notification-diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          cp "ssh-key-2026-03-30 (1).key" /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Final verification pass
        run: |
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@williambunarto.duckdns.org"
          $SSH bash << 'ENDSSH'
          echo '===== fallback send line (should have NO parse_mode) ====='
          grep -n -A1 "_send_admin_message(app, fallback" /home/ubuntu/bot.py
          echo ''
          echo '===== crontab ====='
          crontab -l
          echo ''
          echo '===== bot.py process (single instance) ====='
          pgrep -a -f "python3 bot.py"
          echo ''
          echo '===== py_compile check ====='
          python3 -m py_compile /home/ubuntu/bot.py /home/ubuntu/portfolio.py && echo "syntax OK"
          echo ''
          echo '===== nohup.out tail (confirm clean startup, no errors) ====='
          tail -25 /home/ubuntu/nohup.out
          echo ''
          echo '===== backup files present (rollback safety net) ====='
          ls -la /home/ubuntu/*.bak.* 2>&1
          echo ''
          echo '===== disk space sanity ====='
          df -h / | tail -1
          echo '===== memory sanity ====='
          free -h | grep Mem
          ENDSSH
