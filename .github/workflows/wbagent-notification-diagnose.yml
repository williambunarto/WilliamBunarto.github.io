name: WBAgent Notification Timeout Diagnose

on:
  push:
    paths:
      - '.github/workflows/wbagent-notification-diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          cp "ssh-key-2026-03-30 (1).key" /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Full health check - process, recent errors, health.log, patched source
        run: |
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@williambunarto.duckdns.org"
          $SSH bash << 'ENDSSH'
          echo '===== bot.py process ====='
          pgrep -a -f 'python3 bot.py' || echo 'NONE FOUND -- BOT NOT RUNNING'
          echo ''
          echo '===== process count (should be 1) ====='
          pgrep -f 'python3 bot.py' | wc -l
          echo ''
          echo '===== bot.py syntax ====='
          python3 -m py_compile /home/ubuntu/bot.py && echo 'syntax OK'
          python3 -m py_compile /home/ubuntu/portfolio.py && echo 'syntax OK'
          echo ''
          echo '===== MODELS list currently live ====='
          grep -n "openai/gpt-oss" /home/ubuntu/bot.py
          echo ''
          echo '===== empty-content retry present ====='
          grep -n "returned empty content" /home/ubuntu/bot.py
          echo ''
          echo '===== portfolio.py max_tokens currently live ====='
          grep -n "max_tokens=400\|max_tokens=200" /home/ubuntu/portfolio.py
          echo ''
          echo '===== last 40 lines of nohup.out (looking for errors/tracebacks) ====='
          tail -40 /home/ubuntu/nohup.out
          echo ''
          echo '===== any AI/Groq errors since bot restart ====='
          grep -i "error\|traceback\|exception" /home/ubuntu/nohup.out | tail -20 || echo 'none found'
          echo ''
          echo '===== health.log tail ====='
          tail -10 /home/ubuntu/wbagent/logs/health.log 2>/dev/null || echo 'no health.log entries yet'
          echo ''
          echo '===== crontab (watchdog + reboot supervisor) ====='
          crontab -l
          ENDSSH
