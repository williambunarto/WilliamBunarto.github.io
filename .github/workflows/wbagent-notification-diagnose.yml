name: WBAgent Notification Timeout Diagnose

on:
  push:
    paths:
      - '.github/workflows/wbagent-notification-diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          cp "ssh-key-2026-03-30 (1).key" /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Find all call_groq/groq_fn callers with their max_tokens
        run: |
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@williambunarto.duckdns.org"
          $SSH bash << 'ENDSSH'
          echo '===== all call_groq/groq_fn call sites with max_tokens ====='
          grep -n "call_groq(\|groq_fn(" /home/ubuntu/bot.py /home/ubuntu/portfolio.py /home/ubuntu/btc_signal.py 2>/dev/null
          echo ''
          echo '===== max_tokens values used across those files ====='
          grep -n "max_tokens" /home/ubuntu/bot.py /home/ubuntu/portfolio.py /home/ubuntu/btc_signal.py 2>/dev/null
          ENDSSH
