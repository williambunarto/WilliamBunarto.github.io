name: WBAgent Notification Timeout Diagnose

on:
  push:
    paths:
      - '.github/workflows/wbagent-notification-diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          cp "ssh-key-2026-03-30 (1).key" /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: call_gemini body + GEMINI_API_KEY presence
        run: |
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@williambunarto.duckdns.org"
          $SSH bash << 'ENDSSH'
          echo '===== bot.py lines 145,185 (call_gemini full body) ====='
          sed -n '145,185p' /home/ubuntu/bot.py
          echo ''
          echo '===== GEMINI_API_KEY set? (not printing value) ====='
          if grep -q '^GEMINI_API_KEY=' /home/ubuntu/.env 2>/dev/null; then
            val=$(grep '^GEMINI_API_KEY=' /home/ubuntu/.env | cut -d= -f2-)
            if [ -n "$val" ]; then echo "GEMINI_API_KEY: set (non-empty)"; else echo "GEMINI_API_KEY: present but EMPTY"; fi
          else
            echo "GEMINI_API_KEY: NOT SET in .env"
          fi
          echo ''
          echo '===== EOD report AI failures today, exact count ====='
          grep -c "AI error" /home/ubuntu/nohup.out
          ENDSSH
