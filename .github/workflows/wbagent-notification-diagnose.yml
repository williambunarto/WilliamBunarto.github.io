name: WBAgent Notification Timeout Diagnose

on:
  push:
    paths:
      - '.github/workflows/wbagent-notification-diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          cp "ssh-key-2026-03-30 (1).key" /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Fetch call_groq() and groq_fn definitions verbatim
        run: |
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@williambunarto.duckdns.org"
          $SSH bash << 'ENDSSH'
          echo '===== call_groq() in bot.py ====='
          awk '/^def call_groq/,/^def [a-zA-Z_]+\(/{print NR": "$0}' /home/ubuntu/bot.py | head -60
          echo ''
          echo '===== groq_fn definition/import in portfolio.py ====='
          grep -n "groq_fn" /home/ubuntu/portfolio.py | head -20
          echo ''
          echo '===== groq_fn definition/assignment in bot.py ====='
          grep -n "groq_fn" /home/ubuntu/bot.py | head -20
          ENDSSH
