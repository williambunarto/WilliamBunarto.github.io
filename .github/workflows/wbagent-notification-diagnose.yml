name: WBAgent Notification Timeout Diagnose

on:
  push:
    paths:
      - '.github/workflows/wbagent-notification-diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          cp "ssh-key-2026-03-30 (1).key" /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: scheduled_eod_report full body + BOT_TOKEN/ADMIN_ID defs
        run: |
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@williambunarto.duckdns.org"
          $SSH bash << 'ENDSSH'
          echo '===== bot.py lines 1145,1220 (scheduled_eod_report) ====='
          sed -n '1145,1220p' /home/ubuntu/bot.py
          echo ''
          echo '===== BOT_TOKEN / ADMIN_ID / TZ defs ====='
          grep -n "^BOT_TOKEN\|^ADMIN_ID\|^TZ " /home/ubuntu/bot.py
          echo ''
          echo '===== ls -la /home/ubuntu/wbagent/logs ====='
          ls -la /home/ubuntu/wbagent/logs 2>&1 || echo "dir missing"
          ENDSSH
