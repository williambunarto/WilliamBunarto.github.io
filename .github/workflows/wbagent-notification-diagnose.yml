name: WBAgent Notification Timeout Diagnose

on:
  push:
    paths:
      - '.github/workflows/wbagent-notification-diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          cp "ssh-key-2026-03-30 (1).key" /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Verify the ACTUAL deployed call_groq() retries on empty content
        run: |
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@williambunarto.duckdns.org"
          $SSH bash << 'ENDSSH'
          python3 << 'PYEOF'
          # Extract call_groq()'s real, deployed source verbatim from bot.py
          # (does NOT import bot.py as a module, so this cannot collide with
          # the live running bot process's Telegram polling/scheduler).
          with open("/home/ubuntu/bot.py") as f:
              src = f.read()

          start = src.index("def call_groq(")
          end = src.index("\ndef call_gemini(", start)
          func_src = src[start:end]

          class FakeMsg:
              def __init__(self, content):
                  self.content = content

          class FakeChoice:
              def __init__(self, content):
                  self.message = FakeMsg(content)

          class FakeResp:
              def __init__(self, content):
                  self.choices = [FakeChoice(content)]

          call_log = []

          class FakeCompletions:
              def create(self, model, messages, max_tokens, temperature):
                  call_log.append(model)
                  # Simulate exactly what was observed live: the first model
                  # in this order returns empty content for the budget given.
                  if model == "openai/gpt-oss-20b":
                      return FakeResp("")
                  return FakeResp("Sebaiknya tahan posisi dan pantau pasar.")

          class FakeChat:
              completions = FakeCompletions()

          class FakeGroqClient:
              chat = FakeChat()

          import logging
          logging.basicConfig(level=logging.WARNING, format="  [log] %(message)s")
          log = logging.getLogger("verify")

          def call_gemini(messages, system=None, max_tokens=1200):
              return "GEMINI FALLBACK WAS USED"

          namespace = {
              "groq_client": FakeGroqClient(),
              # 20b (which returns empty) deliberately placed FIRST to force
              # the empty-content retry path regardless of current MODELS order.
              "MODELS": ["openai/gpt-oss-20b", "openai/gpt-oss-120b"],
              "log": log,
              "call_gemini": call_gemini,
              "SYSTEM_PROMPT": "test system prompt",
          }
          exec(func_src, namespace)
          call_groq = namespace["call_groq"]

          result = call_groq([{"role": "user", "content": "test"}], max_tokens=200)
          print(f"Models called in order: {call_log}")
          print(f"Final result: {result!r}")
          if (call_log == ["openai/gpt-oss-20b", "openai/gpt-oss-120b"]
                  and result == "Sebaiknya tahan posisi dan pantau pasar."):
              print("VERIFIED: empty content from the first model correctly "
                    "triggered a retry against the next model.")
          else:
              print("FAILED: empty-content retry logic did not behave as expected.")
          PYEOF
          ENDSSH
