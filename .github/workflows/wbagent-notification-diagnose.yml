name: WBAgent Notification Timeout Diagnose

on:
  push:
    paths:
      - '.github/workflows/wbagent-notification-diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          cp "ssh-key-2026-03-30 (1).key" /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Check real scheduled open_pulse run + health.log
        run: |
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@williambunarto.duckdns.org"
          $SSH bash << 'ENDSSH'
          echo '===== health.log (real job outcomes since hotfix) ====='
          cat /home/ubuntu/wbagent/logs/health.log 2>&1 || echo "no health.log yet"
          echo ''
          echo '===== nohup.out grep for open pulse around 01:05 UTC today ====='
          grep -i "open pulse\|open_pulse" /home/ubuntu/nohup.out | tail -20
          echo ''
          echo '===== full context around todays open pulse run ====='
          grep -n -B2 -A5 "Open pulse starting" /home/ubuntu/nohup.out | tail -40
          ENDSSH
