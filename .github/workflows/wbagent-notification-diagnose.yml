name: WBAgent Notification Timeout Diagnose

on:
  push:
    paths:
      - '.github/workflows/wbagent-notification-diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          cp "ssh-key-2026-03-30 (1).key" /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Verify patched bot.py sections
        run: |
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@williambunarto.duckdns.org"
          $SSH bash << 'ENDSSH'
          echo '===== ApplicationBuilder ====='
          grep -n -A8 "app = (" /home/ubuntu/bot.py | head -12
          echo ''
          echo '===== scheduled_open_pulse (patched) ====='
          grep -n "async def scheduled_open_pulse" /home/ubuntu/bot.py
          sed -n '/async def scheduled_open_pulse/,/^async def scheduled_eod_report/p' /home/ubuntu/bot.py
          echo ''
          echo '===== scheduler.add_job blocks ====='
          grep -n -B1 -A5 "scheduler.add_job" /home/ubuntu/bot.py
          echo ''
          echo '===== current bot.py process (single instance check) ====='
          pgrep -a -f "python3 bot.py"
          echo ''
          echo '===== health.log ====='
          cat /home/ubuntu/wbagent/logs/health.log 2>&1 || echo "no entries yet (expected - open_pulse runs at 08:05 WIB)"
          ENDSSH
