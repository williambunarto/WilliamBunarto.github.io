name: WBAgent Notification Timeout Diagnose

on:
  push:
    paths:
      - '.github/workflows/wbagent-notification-diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          cp "ssh-key-2026-03-30 (1).key" /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Exact MODELS block + line numbers
        run: |
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@williambunarto.duckdns.org"
          $SSH bash << 'ENDSSH'
          echo '===== cat -A on lines 84,92 (show exact whitespace/tabs) ====='
          sed -n '84,92p' /home/ubuntu/bot.py | cat -A | head -20
          echo ''
          echo '===== plain lines 84,92 ====='
          sed -n '84,92p' /home/ubuntu/bot.py
          echo ''
          echo '===== any other MODELS or model list refs in whole file ====='
          grep -n "MODELS" /home/ubuntu/bot.py
          ENDSSH
