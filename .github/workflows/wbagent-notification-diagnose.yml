name: WBAgent Notification Timeout Diagnose

on:
  push:
    paths:
      - '.github/workflows/wbagent-notification-diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Bot service + logs
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 140.245.103.249
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo '===== systemctl status wbagent ====='
            sudo systemctl status wbagent --no-pager 2>&1 || echo "no wbagent unit"
            echo ''
            echo '===== journalctl -u wbagent -n 150 ====='
            sudo journalctl -u wbagent -n 150 --no-pager 2>&1 || echo "no journal for wbagent"
            echo ''
            echo '===== journalctl -u wbagent --since today ====='
            sudo journalctl -u wbagent --since today --no-pager 2>&1 || echo "no journal since today"
            echo ''
            echo '===== running python processes ====='
            pgrep -a -f python3 || echo "none running"
            echo ''
            echo '===== crontab -l ====='
            crontab -l 2>&1 || echo "no crontab"
            echo ''
            echo '===== systemd unit file ====='
            cat /etc/systemd/system/wbagent.service 2>&1 || echo "no unit file at that path"
            find /etc/systemd/system -iname "*wbagent*" -o -iname "*bot*" 2>/dev/null

      - name: Find scheduler / pulse / daily notification files
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 140.245.103.249
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo '===== files mentioning pulse/scheduler/APScheduler/daily/morning/insight ====='
            find /home/ubuntu -maxdepth 3 -name "*.py" 2>/dev/null | xargs grep -l "pulse\|scheduler\|APScheduler\|daily\|morning\|insight" 2>/dev/null
            echo ''
            echo '===== grep "pulse" occurrences with context ====='
            find /home/ubuntu -maxdepth 3 -name "*.py" 2>/dev/null | xargs grep -n "pulse" 2>/dev/null
            echo ''
            echo '===== grep scheduler.add_job / APScheduler setup ====='
            find /home/ubuntu -maxdepth 3 -name "*.py" 2>/dev/null | xargs grep -n "add_job\|BackgroundScheduler\|AsyncIOScheduler\|BlockingScheduler" 2>/dev/null
            echo ''
            echo '===== requests.get / requests.post calls without timeout ====='
            find /home/ubuntu -maxdepth 3 -name "*.py" 2>/dev/null | xargs grep -n "requests\.get(\|requests\.post(" 2>/dev/null
            echo ''
            echo '===== bot log tail ====='
            tail -100 /home/ubuntu/bot.log 2>&1 || echo "no bot.log"
            echo ''
            echo '===== bot.log timeout/error grep (today) ====='
            grep -i "pulse\|timeout\|timed out\|error" /home/ubuntu/bot.log 2>/dev/null | tail -60 || echo "no matches"

      - name: External connectivity + system resources
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 140.245.103.249
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo '===== Bybit API ====='
            curl -m 10 -s -o /dev/null -w "http_code=%{http_code} time_total=%{time_total}\n" "https://api.bybit.com/v5/market/tickers?category=linear&symbol=BTCUSDT" || echo "bybit curl failed"
            echo '===== Alternative.me FNG ====='
            curl -m 10 -s -o /dev/null -w "http_code=%{http_code} time_total=%{time_total}\n" "https://api.alternative.me/fng/" || echo "fng curl failed"
            echo '===== api.telegram.org ====='
            curl -m 10 -s -o /dev/null -w "http_code=%{http_code} time_total=%{time_total}\n" "https://api.telegram.org" || echo "telegram curl failed"
            echo '===== grok/x.ai ====='
            curl -m 10 -s -o /dev/null -w "http_code=%{http_code} time_total=%{time_total}\n" "https://api.grok.x.ai" || echo "grok unreachable"
            echo ''
            echo '===== ping bybit ====='
            ping -c 5 api.bybit.com 2>&1 || true
            echo '===== ping 8.8.8.8 ====='
            ping -c 5 8.8.8.8 2>&1 || true
            echo ''
            echo '===== free -h ====='
            free -h
            echo '===== df -h ====='
            df -h
            echo '===== top ====='
            top -bn1 | head -20
            echo '===== uptime ====='
            uptime
