name: WBAgent Notification Timeout Diagnose

on:
  push:
    paths:
      - '.github/workflows/wbagent-notification-diagnose.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          cp "ssh-key-2026-03-30 (1).key" /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: full get_prices / get_btc_price / build_open_pulse source
        run: |
          SSH="ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@williambunarto.duckdns.org"
          $SSH bash << 'ENDSSH'
          echo '===== portfolio.py lines 185,260 (get_prices) ====='
          sed -n '185,260p' /home/ubuntu/portfolio.py
          echo ''
          echo '===== portfolio.py lines 460,545 (get_btc_price + build_open_pulse start) ====='
          sed -n '460,545p' /home/ubuntu/portfolio.py
          echo ''
          echo '===== wc -l portfolio.py bot.py ====='
          wc -l /home/ubuntu/portfolio.py /home/ubuntu/bot.py
          ENDSSH
