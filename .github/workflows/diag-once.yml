name: Server diagnostic (one-off)
on:
  push:
    paths: ['.github/workflows/diag-once.yml']
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check
        env:
          K: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          printf '%s\n' "$K" > /tmp/dk; chmod 600 /tmp/dk
          O="-o StrictHostKeyChecking=no -o ConnectTimeout=15 -o BatchMode=yes -i /tmp/dk"
          OUT=$(timeout 60 ssh $O ubuntu@140.245.103.249 'echo bot_procs=$(pgrep -fc "python3.*bot.py"); echo old_token_files=$(grep -rIl "8674830266:AAGZ" /home/ubuntu --exclude-dir=.git --exclude="*.bak*" 2>/dev/null | wc -l); echo old_in_bak=$(grep -rIl "8674830266:AAGZ" /home/ubuntu 2>/dev/null | wc -l); echo auth_keys=$(grep -c . ~/.ssh/authorized_keys); echo ssh_ok=1' 2>&1 | tr '\n' ' ')
          echo "::notice::DIAG $OUT"
