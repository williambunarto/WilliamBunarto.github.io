name: Debug Padel Nginx

on:
  push:
    paths:
      - '.github/workflows/debug-padel.yml'
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          cp "ssh-key-2026-03-30 (1).key" /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Dump nginx config + local checks
        run: |
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@williambunarto.duckdns.org 'bash -s' << 'ENDSSH'
            echo "=== sites-enabled ==="
            ls -la /etc/nginx/sites-enabled/
            echo ""
            echo "=== full nginx -T (server blocks + listen/server_name only) ==="
            sudo nginx -T 2>/dev/null | grep -nE "server_name|listen|location|# conf|nginx.conf|sites-enabled" | head -100
            echo ""
            echo "=== /etc/nginx/sites-available/healthos (full, numbered) ==="
            cat -n /etc/nginx/sites-available/healthos
            echo ""
            echo "=== curl app directly on 127.0.0.1:8002 ==="
            curl -s -o /dev/null -w 'direct app status: %{http_code}\n' http://127.0.0.1:8002/
            echo ""
            echo "=== curl via nginx on 127.0.0.1:80/padel/ ==="
            curl -sv http://127.0.0.1/padel/ 2>&1 | tail -30
          ENDSSH
