name: Verify Padel Live Deployment v2 (read-only)

on:
  push:
    paths:
      - '.github/workflows/verify-padel-v2.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          cp "ssh-key-2026-03-30 (1).key" /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Read-only functional checks against the live app (new schema)
        run: |
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@williambunarto.duckdns.org 'bash -s' << 'ENDSSH'
            echo "=== systemd status ==="
            sudo systemctl is-active padel
            echo ""
            echo "=== via nginx: root, static JS, static CSS ==="
            curl -s -o /dev/null -w 'root: %{http_code}\n' http://williambunarto.duckdns.org/padel/
            curl -s -o /dev/null -w 'app.js: %{http_code}\n' http://williambunarto.duckdns.org/padel/static/js/app.js
            curl -s -o /dev/null -w 'style.css: %{http_code}\n' http://williambunarto.duckdns.org/padel/static/css/style.css
            echo ""
            echo "=== login superadmin / admin (via nginx) ==="
            curl -s -c /tmp/sa.txt -X POST http://127.0.0.1/padel/api/auth/login -H 'Content-Type: application/json' -d '{"username":"superadmin","password":"superadmin"}'
            echo ""
            curl -s -c /tmp/ad.txt -X POST http://127.0.0.1/padel/api/auth/login -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin"}'
            echo ""
            echo "=== superadmin: locations, players, packages, rate-cards, users, dashboard ==="
            curl -s -b /tmp/sa.txt -o /dev/null -w 'GET /api/locations: %{http_code}\n' http://127.0.0.1/padel/api/locations
            curl -s -b /tmp/sa.txt -o /dev/null -w 'GET /api/players: %{http_code}\n' http://127.0.0.1/padel/api/players
            curl -s -b /tmp/sa.txt -o /dev/null -w 'GET /api/packages: %{http_code}\n' http://127.0.0.1/padel/api/packages
            curl -s -b /tmp/sa.txt -o /dev/null -w 'GET /api/rate-cards: %{http_code}\n' http://127.0.0.1/padel/api/rate-cards
            curl -s -b /tmp/sa.txt -o /dev/null -w 'GET /api/users: %{http_code}\n' http://127.0.0.1/padel/api/users
            curl -s -b /tmp/sa.txt -o /dev/null -w 'GET /api/reports/dashboard: %{http_code}\n' http://127.0.0.1/padel/api/reports/dashboard
            curl -s -b /tmp/sa.txt -o /dev/null -w 'GET /api/reports/players: %{http_code}\n' http://127.0.0.1/padel/api/reports/players
            echo ""
            echo "=== RBAC: admin blocked from users + rate-card mutation ==="
            curl -s -b /tmp/ad.txt -o /dev/null -w 'admin GET /api/users (want 403): %{http_code}\n' http://127.0.0.1/padel/api/users
            curl -s -b /tmp/ad.txt -o /dev/null -w 'admin POST /api/rate-cards (want 403): %{http_code}\n' -X POST http://127.0.0.1/padel/api/rate-cards -H 'Content-Type: application/json' -d '{"location_id":1,"day_type":"weekday","time_band":"x","time_start":"00:00","time_end":"01:00","sell_price_per_hour":1}'
            curl -s -b /tmp/ad.txt -o /dev/null -w 'admin GET /api/sessions (want 200): %{http_code}\n' http://127.0.0.1/padel/api/sessions
            echo ""
            echo "=== anon blocked ==="
            curl -s -o /dev/null -w 'anon GET /api/locations (want 401): %{http_code}\n' http://127.0.0.1/padel/api/locations
            echo ""
            echo "=== old credentials rejected ==="
            curl -s -o /dev/null -w 'old owner/jc login (want 401): %{http_code}\n' -X POST http://127.0.0.1/padel/api/auth/login -H 'Content-Type: application/json' -d '{"username":"owner","password":"padel-owner-2026"}'
            rm -f /tmp/sa.txt /tmp/ad.txt
          ENDSSH
