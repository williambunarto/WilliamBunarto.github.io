name: Rotate server deploy key (one-off)
on:
  push:
    paths: ['.github/workflows/rotate-key.yml']
  workflow_dispatch:
jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the leaked key from history (used once, to rotate it)
        uses: actions/checkout@v4
        with:
          ref: 10f9297
          path: old
      - name: Rotate
        run: |
          set -euo pipefail
          OLD="old/ssh-key-2026-03-30 (1).key"
          chmod 600 "$OLD"
          O="-o StrictHostKeyChecking=no -o ConnectTimeout=15 -o BatchMode=yes -o IdentitiesOnly=yes"
          echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHgAp7R5euIPev4iXGoBNTpaWUURrUMa2R4q++7HFxA4 ci-deploy-2026-10-01' > new.pub
          ssh-keygen -lf new.pub
          ssh $O -i "$OLD" ubuntu@140.245.103.249 bash -s <<'REMOTE'
          set -euo pipefail
          A=$HOME/.ssh/authorized_keys
          cp "$A" "$A.bak.$(date +%s)"
          grep -qF 'AAAAC3NzaC1lZDI1NTE5AAAAIHgAp7R5euIPev4iXGoBNTpaWUURrUMa2R4q++7HFxA4' "$A" || echo 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHgAp7R5euIPev4iXGoBNTpaWUURrUMa2R4q++7HFxA4 ci-deploy-2026-10-01' >> "$A"
          grep -qF 'AAAAC3NzaC1lZDI1NTE5AAAAIHgAp7R5euIPev4iXGoBNTpaWUURrUMa2R4q++7HFxA4' "$A"
          grep -v -F '' "$A" > "$A.new" || true
          grep -qF 'AAAAC3NzaC1lZDI1NTE5AAAAIHgAp7R5euIPev4iXGoBNTpaWUURrUMa2R4q++7HFxA4' "$A.new"
          mv "$A.new" "$A"; chmod 600 "$A"
          echo "keys now: $(grep -c . $A)"
          REMOTE
          if ssh $O -i "$OLD" ubuntu@140.245.103.249 true 2>/dev/null; then echo "OLD KEY STILL WORKS"; exit 1; fi
          echo "rotation verified: old key rejected"
