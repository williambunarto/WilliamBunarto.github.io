name: One-off Padel DB Reset (breaking schema change)

on:
  push:
    paths:
      - '.github/workflows/migrate-padel-db.yml'
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          cp "ssh-key-2026-03-30 (1).key" /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Stop service, wipe old-schema DB, restart (recreates schema + reseeds)
        run: |
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no ubuntu@williambunarto.duckdns.org 'bash -s' << 'ENDSSH'
            set -e
            echo "=== stopping padel ==="
            sudo systemctl stop padel
            echo "=== backing up + removing old db ==="
            if [ -f /home/ubuntu/padel/data/padel.db ]; then
              sudo mv /home/ubuntu/padel/data/padel.db /home/ubuntu/padel/data/padel.db.pre-locations-backup
            fi
            echo "=== starting padel (init_db recreates schema fresh) ==="
            sudo systemctl start padel
            sleep 3
            sudo systemctl status padel --no-pager -l
            echo ""
            echo "=== smoke test: new schema endpoints ==="
            curl -s -c /tmp/sa_ck.txt -X POST http://127.0.0.1:8002/api/auth/login \
              -H 'Content-Type: application/json' -d '{"username":"superadmin","password":"superadmin"}'
            echo ""
            curl -s -b /tmp/sa_ck.txt -o /dev/null -w 'GET /api/locations status: %{http_code}\n' http://127.0.0.1:8002/api/locations
            curl -s -b /tmp/sa_ck.txt -o /dev/null -w 'GET /api/users status: %{http_code}\n' http://127.0.0.1:8002/api/users
            rm -f /tmp/sa_ck.txt
          ENDSSH
