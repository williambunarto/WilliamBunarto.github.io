name: Apply Telegram token (one-off v2)
on:
  push:
    paths: ['.github/workflows/apply-tg.yml']
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Apply
        env:
          K: ${{ secrets.DEPLOY_SSH_KEY }}
          BLOB: 'U2FsdGVkX1/Qyepi8KiJ0Jy3g2HdCQrCnNsR98MrwgRHlAqpshGj00adMbqpSKfcVYcOfkjsVyPUGgSMJjR0Ew=='
        run: |
          printf '%s\n' "$K" > /tmp/dk; chmod 600 /tmp/dk
          PASS=$(printf '%s' "$K" | tr -d ' \r\n' | sha256sum | cut -d' ' -f1)
          TOKEN=$(printf '%s' "$BLOB" | openssl enc -d -aes-256-cbc -pbkdf2 -a -A -pass "pass:$PASS")
          echo "::add-mask::$TOKEN"
          O="-o StrictHostKeyChecking=no -o ConnectTimeout=15 -o BatchMode=yes -o LogLevel=ERROR -i /tmp/dk"
          printf '%s' "$TOKEN" > /tmp/nt
          cat > /tmp/apply.sh <<'REMOTE'
          T=$(cat /tmp/.nt); rm -f /tmp/.nt
          echo "getMe: $(curl -s -m 10 https://api.telegram.org/bot$T/getMe | grep -c '"ok":true')"
          for f in $(timeout 60 grep -rIl "8674830266:AAGZ" /home/ubuntu --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=venv --exclude-dir=.cache 2>/dev/null); do
            case "$f" in *.bak*) continue;; esac
            cp "$f" "$f.bak-tg"; sed -i -E "s|8674830266:[A-Za-z0-9_-]+|$T|g" "$f"; echo "updated $f"
          done
          curl -s -m 10 -X PUT http://127.0.0.1:8001/api/settings/ -F "telegram_bot_token=$T" >/dev/null && echo "wbtrade settings ok"
          pkill -f "bot[.]py"; sleep 3
          cd /home/ubuntu && setsid nohup python3 bot.py >> nohup.out 2>&1 < /dev/null &
          sleep 6
          echo "bot procs: $(pgrep -fc 'bot[.]py')"
          echo "old token left: $(grep -rIl '8674830266:AAGZ' /home/ubuntu --exclude-dir=.git --exclude='*.bak*' 2>/dev/null | wc -l)"
          REMOTE
          sed -i 's/^          //' /tmp/apply.sh
          scp $O /tmp/nt ubuntu@140.245.103.249:/tmp/.nt
          scp $O /tmp/apply.sh ubuntu@140.245.103.249:/tmp/apply.sh
          OUT=$(timeout 120 ssh $O ubuntu@140.245.103.249 'bash /tmp/apply.sh < /dev/null; rm -f /tmp/apply.sh' 2>&1 | tr '\n' ';')
          echo "::notice::APPLY $OUT"
